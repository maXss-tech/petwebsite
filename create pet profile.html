  <section class="page-header"><h1><i class="fas fa-dog"></i> Create Pet Profile</h1><p>Add your best friend in 30 seconds</p></section>
  <section class="form-section">
    <form class="pet-form">
      <label>Pet Name <input type="text" placeholder="Buddy" required></label>
      <label>Breed <input type="text" placeholder="Golden Retriever"></label>
      <label>Age <input type="number" placeholder="2"></label>
      <label>Photo <input type="file" accept="image/*"></label>
      <label>Vaccination Record <textarea placeholder="Rabies, DHPP..."></textarea></label>
      <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Save Profile</button>
    </form>
  </section>
