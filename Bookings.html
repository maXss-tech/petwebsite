<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PawBnB · Bookings</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css">
  <style>
    /* Status pills, built from the same tokens already in style.css */
    .status-tag{ display:inline-block; padding:.2rem .6rem; border-radius:999px; font-size:.75rem; font-weight:700; }
    .status-tag.confirmed{ background:#E5F1E7; color:var(--green-dark); }
    .status-tag.checked-in{ background:#EFE6F7; color:#5B3B8C; }
    .status-tag.pending{ background:#FFF1D6; color:var(--brown); }
    .status-tag.cancelled{ background:#FBE7E4; color:var(--red); }
  </style>
</head>
<body>
  <nav class="navbar"><div class="nav-container">
    <div class="nav-logo"><i class="fas fa-paw" style="color:#C99A4A;"></i><span>PawBnB</span></div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="admindashboard.html">Admin</a></li>
    </ul>
  </div></nav>

  <div class="dash-layout">
    <aside class="dash-sidebar">
      <div class="dash-title"><i class="fas fa-paw"></i> PawBnB Admin</div>
      <a href="admindashboard.html" class="dash-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Overview
      </a>

      <a href="pets.html" class="dash-link" data-panel="pets">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="4" cy="8" r="2"/><circle cx="8" cy="14" r="2"/><path d="M13 14a4 4 0 0 0-8 0c0 3 3 6 5 8 2-2 5-5 5-8a4 4 0 0 0-2-4"/></svg>
        Pets
      </a>

      

      <a href="bookings.html" class="dash-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
        Bookings
      </a>
      <a href="#" class="dash-link dash-signout" id="signout-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </a>
    </aside>

    <main class="dash-main">
      <div class="dash-header">
        <div>
          <h1>Bookings</h1>
          <p id="welcome-line">Loading admin session…</p>
        </div>
      </div>

      <!-- These counts come straight from the "bookings" collection below.
           They only change when a real booking document is added, updated,
           or its status changes — nothing here is typed in by hand. -->
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Total Bookings</div><div class="stat-value" id="stat-total">–</div></div>
        <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value" id="stat-pending">–</div></div>
        <div class="stat-card"><div class="stat-label">Checked In</div><div class="stat-value" id="stat-checkedin">–</div></div>
        <div class="stat-card"><div class="stat-label">Confirmed</div><div class="stat-value" id="stat-confirmed">–</div></div>
      </div>

      <div class="dash-panel">
        <div class="dash-panel-head"><h2>Ongoing Bookings</h2></div>
        <table class="dash-table">
          <thead><tr><th>Pet</th><th>Owner</th><th>Dates</th><th>Status</th></tr></thead>
          <tbody id="bookings-body">
            <tr><td colspan="4" class="dash-empty">Loading bookings…</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    /* ---- Route guard: only signed-in admins get in, same as admindashboard.html ---- */
    auth.onAuthStateChanged(function (user) {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      getUserProfile(user.uid).then(function (profile) {
        if (!profile || profile.role !== 'admin') {
          window.location.href = 'index.html';
          return;
        }
        document.getElementById('welcome-line').textContent =
          'Signed in as ' + (profile.name || user.email);
        loadBookings();
      });
    });

    document.getElementById('signout-btn').addEventListener('click', function (e) {
      e.preventDefault();
      auth.signOut().then(function () { window.location.href = 'login.html'; });
    });

    /* ---- Bookings: live from Firestore, both the table and the stat cards.
       Uses onSnapshot (not get()) so the numbers update immediately if a
       booking is added or its status changes elsewhere in the app — no
       page refresh needed, and nothing here can be edited by hand. ---- */
    function loadBookings() {
      const body = document.getElementById('bookings-body');

      db.collection('bookings').orderBy('createdAt', 'desc')
        .onSnapshot(function (snap) {
          // Totals
          let total = 0, pending = 0, checkedIn = 0, confirmed = 0;

          if (snap.empty) {
            body.innerHTML = '<tr><td colspan="4" class="dash-empty">No bookings yet.</td></tr>';
          } else {
            body.innerHTML = '';
          }

          snap.forEach(function (doc) {
            const b = doc.data();
            total++;

            const status = (b.status || 'pending').toLowerCase();
            const statusClass = status.replace(/\s+/g, '-'); // "checked in" -> "checked-in"

            if (status === 'pending') pending++;
            else if (status === 'checked in' || status === 'checked-in') checkedIn++;
            else if (status === 'confirmed') confirmed++;

            body.insertAdjacentHTML('beforeend',
              '<tr>' +
              '<td>' + escapeHtml(b.petName || '—') + '</td>' +
              '<td>' + escapeHtml(b.ownerName || '—') + '</td>' +
              '<td>' + escapeHtml(b.dates || '—') + '</td>' +
              '<td><span class="status-tag ' + statusClass + '">' + escapeHtml(b.status || 'pending') + '</span></td>' +
              '</tr>');
          });

          setStat('stat-total', total);
          setStat('stat-pending', pending);
          setStat('stat-checkedin', checkedIn);
          setStat('stat-confirmed', confirmed);
        }, function () {
          body.innerHTML = '<tr><td colspan="4" class="dash-empty">Couldn\'t load bookings. Check Firestore rules.</td></tr>';
          ['stat-total', 'stat-pending', 'stat-checkedin', 'stat-confirmed'].forEach(function (id) {
            setStat(id, '—');
          });
        });
    }

    function setStat(id, val) { document.getElementById(id).textContent = val; }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }
  </script>
</body>
</html>
