<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PawBnB · Pets</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css">
  <style>
    .species-tag{ display:inline-block; padding:.2rem .6rem; border-radius:999px; font-size:.75rem; font-weight:700; }
    .species-tag.dog{ background:#E5F1E7; color:var(--green-dark); }
    .species-tag.cat{ background:#EFE6F7; color:#5B3B8C; }
    .species-tag.rabbit{ background:#FFF1D6; color:var(--brown); }
    .species-tag.bird{ background:#E4F1FA; color:#1F5B7A; }
    .species-tag.other{ background:var(--cream-2); color:var(--brown); }
    .pet-cell{ display:flex; align-items:center; gap:.6rem; }
    .pet-avatar{
      width:30px; height:30px; border-radius:50%;
      background:var(--cream-2); display:flex; align-items:center; justify-content:center;
      font-size:14px; flex-shrink:0;
    }
  </style>
</head>
<body>
  <nav class="navbar"><div class="nav-container">
    <div class="nav-logo"><i class="fas fa-paw" style="color:#C99A4A;"></i><span>PawBnB</span></div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="admindashboard.html">Admin</a></li>
    </ul>
  </div></nav>

  <div class="dash-layout">
    <aside class="dash-sidebar">
      <div class="dash-title"><i class="fas fa-paw"></i> PawBnB Admin</div>
      <a href="admindashboard.html" class="dash-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Overview
      </a>
      <a href="pets.html" class="dash-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="4" cy="8" r="2"/><circle cx="8" cy="14" r="2"/><path d="M13 14a4 4 0 0 0-8 0c0 3 3 6 5 8 2-2 5-5 5-8a4 4 0 0 0-2-4"/></svg>
        Pets
      </a>

     

      <a href="bookings.html" class="dash-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
        Bookings
      </a>
      <a href="#" class="dash-link dash-signout" id="signout-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </a>
    </aside>

    <main class="dash-main">
      <div class="dash-header">
        <div>
          <h1>Pets</h1>
          <p id="welcome-line">Loading admin session…</p>
        </div>
      </div>

      <!-- These counts come straight from the "pets" collection — the same
           one createpet.html writes to. They only change when someone
           actually adds a pet profile in the app. -->
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Total Pets</div><div class="stat-value" id="stat-total">–</div></div>
        <div class="stat-card"><div class="stat-label">Dogs</div><div class="stat-value" id="stat-dogs">–</div></div>
        <div class="stat-card"><div class="stat-label">Cats</div><div class="stat-value" id="stat-cats">–</div></div>
        <div class="stat-card"><div class="stat-label">Other</div><div class="stat-value" id="stat-other">–</div></div>
      </div>

      <div class="dash-panel">
        <div class="dash-panel-head"><h2>All Pets</h2></div>
        <table class="dash-table">
          <thead><tr><th>Pet</th><th>Species</th><th>Breed</th><th>Age</th><th>Owner</th></tr></thead>
          <tbody id="pets-body">
            <tr><td colspan="5" class="dash-empty">Loading pets…</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    /* ---- Route guard: only signed-in admins get in, same as admindashboard.html ---- */
    auth.onAuthStateChanged(function (user) {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      getUserProfile(user.uid).then(function (profile) {
        if (!profile || profile.role !== 'admin') {
          window.location.href = 'index.html';
          return;
        }
        document.getElementById('welcome-line').textContent =
          'Signed in as ' + (profile.name || user.email);
        loadPets();
      });
    });

    document.getElementById('signout-btn').addEventListener('click', function (e) {
      e.preventDefault();
      auth.signOut().then(function () { window.location.href = 'login.html'; });
    });

    const emojiFor = { dog: '🐕', cat: '🐈', rabbit: '🐇', bird: '🐦' };

    /* ---- Pets: live from Firestore, same onSnapshot pattern as bookings.html
       so the table and stat cards update immediately when a pet is added. ---- */
    function loadPets() {
      const body = document.getElementById('pets-body');

      db.collection('pets').orderBy('createdAt', 'desc')
        .onSnapshot(function (snap) {
          let total = 0, dogs = 0, cats = 0, other = 0;

          if (snap.empty) {
            body.innerHTML = '<tr><td colspan="5" class="dash-empty">No pets yet.</td></tr>';
          } else {
            body.innerHTML = '';
          }

          snap.forEach(function (doc) {
            const p = doc.data();
            total++;

            const species = (p.species || 'other').toLowerCase();
            const speciesClass = ['dog', 'cat', 'rabbit', 'bird'].includes(species) ? species : 'other';

            if (species === 'dog') dogs++;
            else if (species === 'cat') cats++;
            else other++;

            body.insertAdjacentHTML('beforeend',
              '<tr>' +
              '<td><div class="pet-cell"><span class="pet-avatar">' + (emojiFor[species] || '🐾') + '</span>' + escapeHtml(p.name || '—') + '</div></td>' +
              '<td><span class="species-tag ' + speciesClass + '">' + escapeHtml(p.species || 'Other') + '</span></td>' +
              '<td>' + escapeHtml(p.breed || '—') + '</td>' +
              '<td>' + escapeHtml(String(p.age || '—')) + '</td>' +
              '<td>' + escapeHtml(p.ownerName || '—') + '</td>' +
              '</tr>');
          });

          setStat('stat-total', total);
          setStat('stat-dogs', dogs);
          setStat('stat-cats', cats);
          setStat('stat-other', other);
        }, function () {
          body.innerHTML = '<tr><td colspan="5" class="dash-empty">Couldn\'t load pets. Check Firestore rules.</td></tr>';
          ['stat-total', 'stat-dogs', 'stat-cats', 'stat-other'].forEach(function (id) {
            setStat(id, '—');
          });
        });
    }

    function setStat(id, val) { document.getElementById(id).textContent = val; }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }
  </script>
</body>
</html>
