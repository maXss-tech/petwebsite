<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PawBnB · Create Pet Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar"><div class="nav-container">
    <div class="nav-logo"><i class="fas fa-paw" style="color:#f9b83a;"></i><span>PawBnB</span></div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li><li><a href="about-us.html">About Us</a></li>
      <li><a href="create-pet-profile.html" class="active">Create Pet</a></li>
      <li><a href="pet-emergency-assistance.html">Pet Emergency</a></li>
      <li><a href="customer-service.html">Customer Service</a></li><li><a href="book.html">Book</a></li>
    </ul>
  </div></nav>

  <section class="page-header"><h1><i class="fas fa-dog"></i> Create Pet Profile</h1><p>Add your best friend in 30 seconds</p></section>
  <section class="form-section">
    <div id="form-msg" class="form-msg"></div>

    <form class="pet-form" id="pet-form" novalidate>
      <label>Pet Name <input type="text" id="pet-name" placeholder="Buddy" required></label>
      <label>Species
        <select id="pet-species" required>
          <option value="dog">Dog</option>
          <option value="cat">Cat</option>
          <option value="rabbit">Rabbit</option>
          <option value="bird">Bird</option>
          <option value="other">Other</option>
        </select>
      </label>
      <label>Breed <input type="text" id="pet-breed" placeholder="Golden Retriever"></label>
      <label>Age <input type="number" id="pet-age" placeholder="2" min="0" step="1"></label>
      <label>Photo <input type="file" id="pet-photo" accept="image/*"></label>
      <label>Vaccination Record <textarea id="pet-vax" placeholder="Rabies, DHPP..."></textarea></label>
      <button type="submit" class="btn-primary" id="submit-btn"><i class="fas fa-save"></i> Save Profile</button>
    </form>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    const form = document.getElementById('pet-form');
    const msg = document.getElementById('form-msg');
    const btn = document.getElementById('submit-btn');
    let currentUser = null;
    let ownerName = '';

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = 'form-msg ' + type;
    }

    // Must be signed in: pets are tied to their owner.
    auth.onAuthStateChanged(function (user) {
      if (!user) { window.location.href = 'login.html'; return; }
      currentUser = user;
      getUserProfile(user.uid).then(function (p) {
        ownerName = (p && p.name) || user.displayName || user.email;
      });
    });

    // Shrink the photo to ~300px JPEG so it fits comfortably in a Firestore document (1 MB limit).
    function resizeImage(file, max) {
      return new Promise(function (resolve, reject) {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = function () {
          const img = new Image();
          img.onerror = reject;
          img.onload = function () {
            const scale = Math.min(1, max / Math.max(img.width, img.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      msg.className = 'form-msg';

      if (!currentUser) { showMsg('Please sign in first.', 'error'); return; }

      const name = document.getElementById('pet-name').value.trim();
      if (!name) { showMsg('Please enter your pet\'s name.', 'error'); return; }

      const ageVal = document.getElementById('pet-age').value;
      const file = document.getElementById('pet-photo').files[0];

      btn.disabled = true;
      btn.textContent = 'Saving…';

      const photoPromise = file ? resizeImage(file, 300) : Promise.resolve('');

      photoPromise
        .then(function (photo) {
          return db.collection('pets').add({
            name: name,
            species: document.getElementById('pet-species').value,
            breed: document.getElementById('pet-breed').value.trim(),
            age: ageVal === '' ? null : Number(ageVal),
            vaccination: document.getElementById('pet-vax').value.trim(),
            photo: photo,
            ownerId: currentUser.uid,
            ownerName: ownerName || currentUser.email,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        })
        .then(function () {
          showMsg('Pet profile saved! Taking you to booking…', 'success');
          setTimeout(function () { window.location.href = 'book.html'; }, 1000);
        })
        .catch(function (err) {
          showMsg(err.message || 'Could not save the profile. Please try again.', 'error');
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-save"></i> Save Profile';
        });
    });
  </script>
</body>
</html>
